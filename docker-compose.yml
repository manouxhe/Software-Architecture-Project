services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      # Le volume pour sauvegarder la BDD sur ton vrai PC
      - ./backend:/app
      - /app/target
    environment:
      - EMBEDDING_URL=http://embedding-service:8000
    depends_on:
      - embedding-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    # Le frontend dépend du backend pour fonctionner
    depends_on:
      - backend

  embedding-service:
    build: ./embedding-service
    ports:
      - "8000:8000"

  llm-service:
    build: ./LLM_algo
    env_file:
      - .env