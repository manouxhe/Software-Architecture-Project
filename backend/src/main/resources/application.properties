spring.application.name=Clickup

# Création du fichier SQLite à la racine du dossier backend
spring.datasource.url=jdbc:sqlite:clickup.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Le NOUVEAU chemin du dialecte SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Demande à Spring Boot de mettre à jour les tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Exécuter les scripts SQL (comme data.sql) à chaque démarrage
#spring.sql.init.mode=always
# Attendre que Hibernate ait fini de créer les tables avant d'insérer les données
#spring.jpa.defer-datasource-initialization=true

# Microservice Python de détection de doublons
embedding.url=http://localhost:8000
ideas.similarity-threshold=0.55

#nombre max d'idées par semaine par personne
ideas.max-per-week=20